name: LibreGram validation

on:
  push:
    branches:
      - "**"
    paths:
      - "CMakeLists.txt"
      - "Telegram/CMakeLists.txt"
      - "Telegram/Resources/langs/rewrites/**"
      - "Telegram/SourceFiles/libregram/**"
      - "Telegram/SourceFiles/kotato/kotato_settings.cpp"
      - "Telegram/SourceFiles/kotato/kotato_settings_menu.cpp"
      - "docs/MULTI_ACCOUNT.md"
      - "README.md"
      - "lib/xdg/**"
      - "snap/snapcraft.yaml"
      - ".github/workflows/**"
      - "tools/ci/**"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "Telegram/CMakeLists.txt"
      - "Telegram/Resources/langs/rewrites/**"
      - "Telegram/SourceFiles/libregram/**"
      - "Telegram/SourceFiles/kotato/kotato_settings.cpp"
      - "Telegram/SourceFiles/kotato/kotato_settings_menu.cpp"
      - "docs/MULTI_ACCOUNT.md"
      - "README.md"
      - "lib/xdg/**"
      - "snap/snapcraft.yaml"
      - ".github/workflows/**"
      - "tools/ci/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project metadata and resources
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate LibreGram
        run: python3 tools/ci/validate_project.py
