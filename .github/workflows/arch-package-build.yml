name: Build LibreGram Arch package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested beta to GitHub Releases
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "packaging/arch/PKGBUILD"
      - ".github/workflows/arch-package-build.yml"
      - "Telegram/SourceFiles/core/sandbox.cpp"

concurrency:
  group: libregram-arch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build package on Arch Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify build secrets
        env:
          LIBREGRAM_API_ID: ${{ secrets.LIBREGRAM_API_ID }}
          LIBREGRAM_API_HASH: ${{ secrets.LIBREGRAM_API_HASH }}
        run: |
          if [[ -z "$LIBREGRAM_API_ID" || -z "$LIBREGRAM_API_HASH" ]]; then
            echo "::error::Add LIBREGRAM_API_ID and LIBREGRAM_API_HASH in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build package in Arch Linux container
        env:
          LIBREGRAM_API_ID: ${{ secrets.LIBREGRAM_API_ID }}
          LIBREGRAM_API_HASH: ${{ secrets.LIBREGRAM_API_HASH }}
        run: |
          docker run --rm \
            -e LIBREGRAM_API_ID \
            -e LIBREGRAM_API_HASH \
            -e LIBREGRAM_SOURCE_REF="$GITHUB_SHA" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/packaging/arch \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm sudo
              useradd --create-home builder
              echo "builder ALL=(ALL:ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              chmod 440 /etc/sudoers.d/builder
              chown -R builder:builder /workspace/packaging/arch
              runuser -u builder -- env \
                HOME=/home/builder USER=builder LOGNAME=builder \
                LIBREGRAM_API_ID="$LIBREGRAM_API_ID" \
                LIBREGRAM_API_HASH="$LIBREGRAM_API_HASH" \
                LIBREGRAM_SOURCE_REF="$LIBREGRAM_SOURCE_REF" \
                CMAKE_BUILD_PARALLEL_LEVEL=2 \
                makepkg --noconfirm --syncdeps --clean --cleanbuild
              package=libregram-0.1.0beta1-1-x86_64.pkg.tar.zst
              test -f "$package"
              pacman -U --noconfirm "$package"
              test -x /usr/bin/LibreGram
              /usr/bin/libregram-ws-proxy --help >/dev/null
              for executable in /usr/bin/LibreGram /usr/bin/libregram-ws-proxy; do
                dependencies=$(ldd "$executable")
                if [[ "$dependencies" == *"not found"* ]]; then
                  printf "%s\n" "$dependencies" >&2
                  exit 1
                fi
              done
            '

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: libregram-arch-x86_64
          path: packaging/arch/libregram-0.1.0beta1-1-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  publish-beta:
    name: Publish LibreGram Desktop 0.1.0 beta 1
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libregram-arch-x86_64
          path: dist
      - name: Publish the checked Arch package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-beta.1
        run: |
          set -euo pipefail
          cd dist
          package=libregram-0.1.0beta1-1-x86_64.pkg.tar.zst
          test -f "$package"
          sha256sum "$package" > "$package.sha256"
          current_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit supersedes this package."
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This beta has already been published."
            exit 0
          fi
          gh release create "$RELEASE_TAG" "$package" "$package.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "LibreGram Desktop 0.1.0 beta 1" --notes-file - <<'EOF'
          First Linux beta for Arch Linux and CachyOS (x86-64).

          - Toggle WS Proxy from the main menu. Its settings include optional startup, restart and TCP fallback.
          - Manage separate local profiles with their own account data.
          - Use the Graphite theme and native LibreGram settings.

          Download the package below and install it with `sudo pacman -U libregram-0.1.0beta1-1-x86_64.pkg.tar.zst`.
          EOF
