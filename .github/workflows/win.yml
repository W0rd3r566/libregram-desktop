name: Windows.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    # Pushes to the canary branches run only canary.yml, see there.
    branches-ignore:
      - public-canary
      - private-canary
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'kotatogram_changes.txt'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'packaging/**'
      - '!packaging/linux/publish-beta.sh'
      - '!packaging/linux/beta-notes.md'
      - '!packaging/windows/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'kotatogram_changes.txt'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'packaging/**'
      - '!packaging/linux/publish-beta.sh'
      - '!packaging/linux/beta-notes.md'
      - '!packaging/windows/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'

jobs:

  ws-proxy:
    name: WS Proxy (${{ matrix.output_arch }})
    if: >
      !(github.event_name == 'push'
        && contains(github.event.head_commit.message, '[skip ci]'))
      && !(github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name)
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64_x86
            output_arch: x86
            rust_target: i686-pc-windows-msvc
          - arch: x64
            output_arch: x86_64
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            output_arch: arm64
            rust_target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: ${{ matrix.arch }}
      - name: Build WS Proxy
        shell: bash
        env:
          LIBREGRAM_WS_TARGET: ${{ matrix.rust_target }}
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          rustup target add "$LIBREGRAM_WS_TARGET"
          bash Telegram/build/ws-proxy/build.sh artifact
          ./artifact/libregram-ws-proxy.exe --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: libregram-ws-proxy-windows-${{ matrix.output_arch }}
          path: artifact/
          if-no-files-found: error

  windows:
    name: Windows
    needs: ws-proxy
    if: >
      !(github.event_name == 'push'
        && contains(github.event.head_commit.message, '[skip ci]'))
      && !(github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) 
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64_x86
            output_arch: x86
            rust_target: i686-pc-windows-msvc
            pe_machine: '0x014c'
            qt: ''
          - arch: x64
            output_arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            pe_machine: '0x8664'
            qt: qt6
          - arch: arm64
            output_arch: arm64
            rust_target: aarch64-pc-windows-msvc
            pe_machine: '0xaa64'
            qt: qt6

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      OUTPUT_ARCH: ${{ matrix.output_arch }}
      RUST_TARGET: ${{ matrix.rust_target }}
      PE_MACHINE: ${{ matrix.pe_machine }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win.md"
          SDK="$(sed -nE 's/.*\*\*([0-9.]+)(\*\*)? SDK.*/\1/p' "$DOCPATH")"
          test -n "$SDK"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          sha256sum "$TBUILD/$REPO_NAME/$PREPARE_PATH" | cut -d' ' -f1 >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS 2026 Build Tools.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile $exe
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ case(matrix.arch == 'arm64', '', '14.44') }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt5-metadata-v2' }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt5-metadata-v2' }}-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent ${{ matrix.qt }}

      - name: Read configuration matrix.
        env:
          LIBREGRAM_API_ID: ${{ secrets.LIBREGRAM_API_ID }}
          LIBREGRAM_API_HASH: ${{ secrets.LIBREGRAM_API_HASH }}
        shell: bash
        run: |
          case "$OUTPUT_ARCH" in
            x86) build_arch=x86 ;;
            x86_64) build_arch=x64 ;;
            arm64) build_arch=arm ;;
          esac
          echo "TDESKTOP_BUILD_ARCH=$build_arch" >> "$GITHUB_ENV"

          API="-D TDESKTOP_API_TEST=ON"
          if [[ "$GITHUB_EVENT_NAME" != pull_request && -n "$LIBREGRAM_API_ID" && -n "$LIBREGRAM_API_HASH" ]]; then
            API="-D TDESKTOP_API_ID=$LIBREGRAM_API_ID -D TDESKTOP_API_HASH=$LIBREGRAM_API_HASH"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Remove intermediate dependency builds
        shell: bash
        run: |
          find "$LibrariesPath" \
            '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -name '*.prl' -o -name '*.pri' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete
          if [[ "$OUTPUT_ARCH" == x86 ]]; then
            for module in Core Gui Network; do
              if ! compgen -G "$LibrariesPath/Qt-5.*/lib/Qt5${module}*.prl" >/dev/null; then
                echo "Missing Qt 5 static dependency metadata for $module" >&2
                exit 1
              fi
            done
          fi
          df -h "$LibrariesPath"

      - name: Save prepared build tools
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save prepared libraries
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-${{ env.CACHE_KEY }}

      - name: Save prepared Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt5-metadata-v2' }}-${{ env.CACHE_KEY }}

      - name: LibreGram Desktop build.
        run: |
          C:
          cd %userprofile%\TBuild\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D "CMAKE_C_FLAGS_DEBUG=/O1" ^
          -D "CMAKE_CXX_FLAGS_DEBUG=/O1" ^
          -D "CMAKE_EXE_LINKER_FLAGS_DEBUG=/DEBUG:NONE /INCREMENTAL:NO /OPT:REF" ^
          -D "CMAKE_SHARED_LINKER_FLAGS_DEBUG=/DEBUG:NONE /INCREMENTAL:NO /OPT:REF" ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          if errorlevel 1 exit /b 1
          cmake --build ..\out --config Debug --parallel > "%RUNNER_TEMP%\libregram-build.log" 2>&1
          if errorlevel 1 (
            powershell -NoProfile -Command "Get-Content -LiteralPath $env:RUNNER_TEMP/libregram-build.log -Tail 120"
            exit /b 1
          )

      - name: Move artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Debug
          mkdir artifact
          move %OUT%\LibreGram.exe artifact/
      - uses: actions/upload-artifact@v7
        with:
          name: libregram-client-windows-${{ matrix.output_arch }}
          path: artifact/LibreGram.exe
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: libregram-ws-proxy-windows-${{ matrix.output_arch }}
          path: artifact
      - name: Stage licenses
        shell: bash
        run: cp "$TBUILD/$REPO_NAME/"{LICENSE,LEGAL} artifact/

      - name: Verify the client and helper architectures
        shell: pwsh
        run: |
          foreach ($name in @("LibreGram.exe", "libregram-ws-proxy.exe")) {
            $file = Join-Path artifact $name
            $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($file))
            try {
              $reader.BaseStream.Position = 0x3c
              $reader.BaseStream.Position = $reader.ReadInt32()
              if ($reader.ReadUInt32() -ne 0x4550 -or
                  $reader.ReadUInt16() -ne [Convert]::ToUInt16($env:PE_MACHINE.Substring(2), 16)) {
                throw "Unexpected executable architecture for $name"
              }
            } finally {
              $reader.Dispose()
            }
          }

      - name: Build and verify the Windows installer
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          $toolDir = Join-Path $env:RUNNER_TEMP "LibreGram-Inno-Setup"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe -OutFile $tool
          if ((Get-FileHash $tool).Hash -ne "a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c") {
            throw "Inno Setup download failed its hash check"
          }
          $setup = Start-Process -FilePath $tool -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$toolDir`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup installation failed" }
          $iscc = Join-Path $toolDir "ISCC.exe"
          $project = Join-Path $env:TBUILD "$env:REPO_NAME/packaging/windows/LibreGram.iss"
          $source = (Resolve-Path artifact).Path
          $installerName = "LibreGram-Windows-$env:OUTPUT_ARCH.exe"
          & $iscc "/DLibreGramPayload=$source" "/DLibreGramArch=$env:OUTPUT_ARCH" "/O$PWD" $project
          if ($LASTEXITCODE -ne 0) { throw "LibreGram installer build failed" }
          $target = Join-Path $env:RUNNER_TEMP "LibreGram install"
          "LIBREGRAM_INSTALL_DIR=$target" >> $env:GITHUB_ENV
          $installer = Start-Process -FilePath (Join-Path $PWD $installerName) -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Silent installation failed" }
          foreach ($name in @("LibreGram.exe", "libregram-ws-proxy.exe")) {
            $expected = (Get-FileHash (Join-Path $source $name)).Hash
            $installed = (Get-FileHash (Join-Path $target $name)).Hash
            if ($installed -ne $expected) { throw "Installed $name failed its hash check" }
          }

      - name: Verify the Start menu shortcut
        shell: pwsh
        run: |
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'LibreGram Desktop/LibreGram.lnk'
          if (!(Test-Path $link)) { throw "LibreGram Start menu shortcut is missing" }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($link)
          if ($shortcut.TargetPath -ne (Join-Path $env:LIBREGRAM_INSTALL_DIR 'LibreGram.exe')) {
            throw "LibreGram Start menu shortcut points to a different executable"
          }

      - name: Create the portable ZIP
        shell: pwsh
        run: |
          $profile = Join-Path artifact "TelegramForcePortable"
          New-Item -ItemType Directory -Path $profile | Out-Null
          Set-Content (Join-Path $profile "README.txt") "LibreGram stores its portable profile in this folder."
          Compress-Archive -Path artifact/* -DestinationPath "LibreGram-Windows-$env:OUTPUT_ARCH-portable.zip"

      - name: Check the installed WS Proxy listener
        shell: pwsh
        run: |
          $start = [Diagnostics.ProcessStartInfo]::new()
          $start.FileName = Join-Path $env:LIBREGRAM_INSTALL_DIR "libregram-ws-proxy.exe"
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          foreach ($arg in @("--host", "127.0.0.1", "--link-ip", "127.0.0.1", "--port", "0")) {
            $start.ArgumentList.Add($arg)
          }
          $helper = [Diagnostics.Process]::Start($start)
          try {
            $link = $helper.StandardOutput.ReadLineAsync()
            if (!$link.Wait(15000)) { throw "WS Proxy did not announce a listener" }
            $match = [regex]::Match([string]$link.Result, '^tg://proxy\?server=127\.0\.0\.1&port=([1-9]\d*)&')
            if (!$match.Success) { throw "WS Proxy announced an invalid listener" }
            $port = [int]$match.Groups[1].Value
            $client = [Net.Sockets.TcpClient]::new()
            try {
              if (!$client.ConnectAsync("127.0.0.1", $port).Wait(5000)) {
                throw "WS Proxy did not accept a connection"
              }
            } finally {
              $client.Dispose()
            }
            $helper.StandardInput.Close()
            if (!$helper.WaitForExit(10000) -or $helper.ExitCode -ne 0) {
              throw "WS Proxy did not stop cleanly"
            }
          } finally {
            if (!$helper.HasExited) { $helper.Kill() }
            $helper.Dispose()
          }

      - name: Start the installed and portable clients
        shell: pwsh
        run: |
          function Test-LibreGram($binary, $argsList) {
            $app = Start-Process -FilePath $binary -ArgumentList $argsList -PassThru
            try {
              for ($i = 0; $i -lt 60; $i++) {
                $app.Refresh()
                if ($app.HasExited) { throw "$binary exited before opening a window" }
                if ($app.MainWindowHandle -ne 0) { break }
                Start-Sleep -Milliseconds 500
              }
              if ($app.MainWindowHandle -eq 0) { throw "$binary did not open a window" }
              $quit = Start-Process -FilePath $binary -ArgumentList "$argsList -quit" -PassThru
              if (!$quit.WaitForExit(10000) -or $quit.ExitCode -ne 0 -or
                  !$app.WaitForExit(10000) -or $app.ExitCode -ne 0) {
                throw "$binary did not exit cleanly"
              }
            } finally {
              if (!$app.HasExited) { $app.Kill() }
            }
          }

          $profile = Join-Path $env:RUNNER_TEMP "LibreGram-smoke-$PID"
          New-Item -ItemType Directory -Path $profile | Out-Null
          "LIBREGRAM_SMOKE_PROFILE=$profile" >> $env:GITHUB_ENV
          Test-LibreGram (Join-Path $env:LIBREGRAM_INSTALL_DIR "LibreGram.exe") "-workdir `"$profile`" -noupdate"

          $portable = Join-Path $env:RUNNER_TEMP "LibreGram portable $PID"
          "LIBREGRAM_PORTABLE_DIR=$portable" >> $env:GITHUB_ENV
          Expand-Archive "LibreGram-Windows-$env:OUTPUT_ARCH-portable.zip" $portable
          foreach ($name in @("LibreGram.exe", "libregram-ws-proxy.exe")) {
            if ((Get-FileHash (Join-Path $portable $name)).Hash -ne
                (Get-FileHash (Join-Path artifact $name)).Hash) {
              throw "Portable $name failed its hash check"
            }
          }
          Test-LibreGram (Join-Path $portable "LibreGram.exe") "-noupdate"
          if (!(Test-Path (Join-Path $portable "TelegramForcePortable/tdata"))) {
            throw "LibreGram did not create its portable profile"
          }

      - name: Verify uninstallation preserves profiles
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:LIBREGRAM_INSTALL_DIR 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "LibreGram uninstallation failed" }
          if (Test-Path (Join-Path $env:LIBREGRAM_INSTALL_DIR 'LibreGram.exe')) {
            throw "Uninstaller left the installed executable behind"
          }
          if (!(Test-Path (Join-Path $env:LIBREGRAM_SMOKE_PROFILE 'tdata'))) {
            throw "Uninstaller removed the user's profile"
          }
          if (!(Test-Path (Join-Path $env:LIBREGRAM_PORTABLE_DIR 'TelegramForcePortable/tdata'))) {
            throw "Uninstaller removed the portable profile"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: libregram-windows-${{ matrix.output_arch }}
          path: |
            LibreGram-Windows-${{ matrix.output_arch }}.exe
            LibreGram-Windows-${{ matrix.output_arch }}-portable.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: libregram-build-log-windows-${{ matrix.output_arch }}
          path: ${{ runner.temp }}/libregram-build.log
          if-no-files-found: ignore

  publish-beta:
    name: Publish ${{ matrix.label }} packages
    needs: windows
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            label: 'Windows 32 bit'
          - arch: x86_64
            label: 'Windows 64 bit'
          - arch: arm64
            label: 'Windows ARM64'
    steps:
      - uses: actions/checkout@v7
      - name: Find the verified artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq "[.artifacts[] | select(.name == \"libregram-windows-$ARCH\" and .expired == false)] | length")
          echo "available=$available" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.artifact.outputs.available == '1'
        with:
          name: libregram-windows-${{ matrix.arch }}
          path: dist
      - name: Publish the checked installer and portable archive
        if: steps.artifact.outputs.available == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          LIBREGRAM_PACKAGE_PLATFORM: windows-${{ matrix.arch }}
          LIBREGRAM_API_ID: ${{ secrets.LIBREGRAM_API_ID }}
          LIBREGRAM_API_HASH: ${{ secrets.LIBREGRAM_API_HASH }}
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          test -n "$LIBREGRAM_API_ID"
          test -n "$LIBREGRAM_API_HASH"
          installer=LibreGram-Windows-$ARCH.exe
          portable=LibreGram-Windows-$ARCH-portable.zip
          (cd dist && sha256sum "$installer" "$portable" > "SHA256SUMS-windows-$ARCH")
          bash packaging/linux/publish-beta.sh \
            "dist/$installer#$LABEL: Installer" "dist/$portable#$LABEL: Portable" \
            "dist/SHA256SUMS-windows-$ARCH"
